name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Structural linter tests
        run: |
          rustc --test source_lints/mod.rs -o "${RUNNER_TEMP}/ivanka-source-lint-tests"
          "${RUNNER_TEMP}/ivanka-source-lint-tests"
      - name: Clippy (deny correctness and suspicious lints)
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install ruff==0.14.4
      - name: Python regression tests (no private data)
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: Python lint (correctness rules)
        run: ruff check --select E4,E7,E9,F63,F7,F82 benchmarks
