name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Data-only publisher commits only update these generated files.
      # Pages validates and deploys generated data independently.
      - "site/bench/data/runs.json"
      - "site/bench/data/assembler-evidence.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Default rustfmt (all Rust targets)
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Structural linter tests
        run: |
          rustc --test source_lints/mod.rs -o "${RUNNER_TEMP}/ivanka-source-lint-tests"
          "${RUNNER_TEMP}/ivanka-source-lint-tests"
      - name: Clippy (deny correctness, suspicious, perf and complexity)
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf -D clippy::complexity

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lint dependency
        run: python -m pip install ruff==0.14.4
      - name: Python lint (imports, correctness, closure capture)
        run: ruff check --select E4,E9,F,B006,B018,B023 benchmarks

  python-test:
    name: Python tests (${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        total: [4]
        index: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
      - name: Python regression tests shard (no private data)
        run: python -m benchmarks.ci_shard --total ${{ matrix.total }} --index ${{ matrix.index }}

  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]
    if: always()
    steps:
      - name: Fail if any Python lint or test shard failed
        run: |
          if [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-test.result }}" != "success" ]; then
            echo "python-lint=${{ needs.python-lint.result }}"
            echo "python-test=${{ needs.python-test.result }}"
            exit 1
          fi
